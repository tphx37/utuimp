repos:
  # ── Go: build & vet ────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: go-build
        name: go build
        language: system
        entry: go build ./...
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet
        language: system
        entry: go vet ./...
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        language: system
        entry: go test ./... -timeout=2m
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        language: system
        # Says what tidy would change, without changing it: go.mod and
        # go.sum must already be tidy (not merely unchanged since the index).
        entry: go mod tidy -diff
        types: [go]
        pass_filenames: false

  # ── golangci-lint (includes gosec + all security linters) ─────────────────
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        args: [--config=.golangci.yml, --fix=false]
        types: [go]
        pass_filenames: false

  # ── JS (Cloudflare Worker token broker tests) ─────────────────────────────
  - repo: local
    hooks:
      - id: worker-js-test
        name: worker js test
        language: system
        entry: node --test worker/test/token.test.mjs
        files: '^worker/'
        pass_filenames: false

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "\\.(md)$"
      - id: end-of-file-fixer
        exclude: "\\.(md)$"
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]
