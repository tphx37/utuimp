name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v4.0.1
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  UTUIMP_TOKEN_URL: ${{ secrets.UTUIMP_TOKEN_URL }}
  UTUIMP_CLIENT_KEY: ${{ secrets.UTUIMP_CLIENT_KEY }}
  LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
  LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

jobs:
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish,validate,nfpm
        env:
          UTUIMP_SKIP_LINUX: "1"
          UTUIMP_SKIP_WINDOWS: "1"
      - run: mkdir dist-darwin && cp dist/*darwin*.tar.gz dist-darwin/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist-darwin/*.tar.gz

  linux:
    needs: darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: dist-darwin
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UTUIMP_SKIP_DARWIN: "1"

  packages:
    needs: linux
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download published archives and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --dir release-assets --pattern checksums.txt --pattern utuimp_linux_amd64.tar.gz --pattern utuimp_windows_amd64.zip
      - name: Check manifest generator
        run: python3 -B -m unittest discover -s scripts -p test_package_manifests.py
      - name: Generate package manifests
        run: python3 scripts/package-manifests.py "$RELEASE_TAG" release-assets packaging-out
      - name: Add generated manifests to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" packaging-out/packaging.tar.gz packaging-out/packaging.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: packaging-out/
