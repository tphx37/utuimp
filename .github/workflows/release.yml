name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  UTUIMP_TOKEN_URL: ${{ secrets.UTUIMP_TOKEN_URL }}
  UTUIMP_CLIENT_KEY: ${{ secrets.UTUIMP_CLIENT_KEY }}
  LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
  LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

jobs:
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: brew install pkg-config gstreamer
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish,validate
        env:
          UTUIMP_SKIP_LINUX: "1"
          UTUIMP_SKIP_WINDOWS: "1"
      - run: mkdir dist-darwin && cp dist/*darwin*.tar.gz dist-darwin/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist-darwin/*.tar.gz

  linux:
    needs: darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: dist-darwin
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UTUIMP_SKIP_DARWIN: "1"
