<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>utuimp · Apple Music</title>
  {{template "style"}}
</head>
<body>
  {{template "ribbons" .Colors}}
  <main class="card">
    {{template "logo"}}
    <h1>utuimp</h1>

    <p class="what">sign in to Apple Music to play your library in the terminal</p>

    <button class="btn" id="connectBtn" onclick="connectAppleMusic()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      connect Apple Music
    </button>

    <div class="status" id="status" role="status"></div>

    <div class="box" id="successBox">
      <h3>signed in</h3>
      <p>utuimp is now linked to Apple Music<br/>
         you can close this tab</p>
    </div>
  </main>

  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async></script>
  <script>
    const appleGlyph = document.getElementById("connectBtn").querySelector("svg").outerHTML;
    const developerToken = "{{.DeveloperToken}}";
    const callbackState = "{{.State}}";
    const musicKitScript = document.querySelector('script[src*="musickit.js"]');
    const musicKitReady = new Promise((resolve, reject) => {
      let configuring = false;
      const configureMusicKit = async () => {
        if (configuring) return;
        configuring = true;
        try {
          await MusicKit.configure({
            developerToken,
            app: { name: "utuimp", build: "1.0" },
          });
          resolve(MusicKit.getInstance());
        } catch (err) {
          reject(err);
        }
      };
      document.addEventListener("musickitloaded", configureMusicKit, { once: true });
      // The async CDN script can finish before this inline script runs.
      if (window.MusicKit) configureMusicKit();
      musicKitScript.addEventListener("error", () => {
        reject(new Error("could not load Apple MusicKit; check your connection and try again"));
      }, { once: true });
    });
    // The button handler reports the rejection; mark it handled until clicked.
    musicKitReady.catch(() => {});

    async function connectAppleMusic() {
      const btn = document.getElementById("connectBtn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.textContent = "Connecting…";
      status.className = "status";
      status.textContent = "Waiting for Apple Music authorization…";

      try {
        // MusicKit owns Apple's popup, origin handshake and token exchange.
        // The official API returns the user token when authorization succeeds.
        const music = await musicKitReady;
        const result = await music.authorize();
        const userToken = typeof result === "string" ? result : music.musicUserToken;
        if (typeof userToken !== "string" || userToken.length === 0) {
          throw new Error("Apple Music did not return a user token. Check the developer token and try again.");
        }

        status.textContent = "Sending token to utuimp…";
        const resp = await fetch("/callback", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Utuimp-State": callbackState },
          body: JSON.stringify({ user_token: userToken }),
        });

        if (!resp.ok) {
          throw new Error("server returned " + resp.status);
        }

        status.textContent = "";
        document.getElementById("successBox").classList.add("show");
        btn.textContent = "Connected";
      } catch (err) {
        status.className = "status error";
        status.textContent = "Error: " + (err.message || String(err));
        btn.disabled = false;
        btn.innerHTML = appleGlyph + " Try again";
      }
    }
  </script>
</body>
</html>
