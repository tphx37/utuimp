version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: utuimp-linux
    binary: utuimp
    # Set to 1 by the darwin release job, which runs this same config on a
    # macOS runner and cannot build the Linux GStreamer CGO target.
    skip: '{{ eq (index .Env "UTUIMP_SKIP_LINUX") "1" }}'
    ldflags:
      - -s -w
      - -X 'github.com/tphx37/utuimp/internal/version.Version={{ .Version }}'
      - -X 'github.com/tphx37/utuimp/internal/auth.tokenURL={{ .Env.UTUIMP_TOKEN_URL }}'
      - -X 'github.com/tphx37/utuimp/internal/auth.clientKey={{ .Env.UTUIMP_CLIENT_KEY }}'
      - -X 'github.com/tphx37/utuimp/internal/lastfm.apiKey={{ .Env.LASTFM_API_KEY }}'
      - -X 'github.com/tphx37/utuimp/internal/lastfm.apiSecret={{ .Env.LASTFM_API_SECRET }}'
    env:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=local
    goos:
      - linux
    goarch:
      - amd64
      # linux/arm64 is not published here yet: this CGO/GStreamer build needs
      # an aarch64 toolchain (CC=aarch64-linux-gnu-gcc + arm64 GStreamer) or a
      # native arm64 runner. Until then arm64 users build from source with
      # `make build`.

  - id: utuimp-darwin
    binary: utuimp
    # Set to 1 by the linux release job. Darwin is built on a macOS runner so
    # that CGO_ENABLED=1 below has a working clang and the macOS SDK; the two
    # jobs each skip the other's target.
    skip: '{{ eq (index .Env "UTUIMP_SKIP_DARWIN") "1" }}'
    ldflags:
      - -s -w
      - -X 'github.com/tphx37/utuimp/internal/version.Version={{ .Version }}'
      - -X 'github.com/tphx37/utuimp/internal/auth.tokenURL={{ .Env.UTUIMP_TOKEN_URL }}'
      - -X 'github.com/tphx37/utuimp/internal/auth.clientKey={{ .Env.UTUIMP_CLIENT_KEY }}'
      - -X 'github.com/tphx37/utuimp/internal/lastfm.apiKey={{ .Env.LASTFM_API_KEY }}'
      - -X 'github.com/tphx37/utuimp/internal/lastfm.apiSecret={{ .Env.LASTFM_API_SECRET }}'
    env:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=local
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      # macos-latest is arm64, so darwin/amd64 is a cgo cross-compile and clang
      # has to be told which architecture to emit. Only the compiler vars belong
      # here: this env is merged into the build's rather than replacing it, so
      # CGO_ENABLED=1 above still reaches the amd64 target.
      - goos: darwin
        goarch: amd64
        env:
          - CC=clang -arch x86_64
          - CXX=clang++ -arch x86_64

  - id: utuimp-windows
    binary: utuimp
    # Cross-compiled by the Linux release job with MinGW: the native browserless
    # engine is a C++ CDM bridge plus a Media Foundation sink, so this is a cgo
    # build. The runtime is linked statically (see the #cgo directives), leaving
    # utuimp.exe with imports only of DLLs every Windows install has.
    skip: '{{ eq (index .Env "UTUIMP_SKIP_WINDOWS") "1" }}'
    ldflags:
      - -s -w
      - -X 'github.com/tphx37/utuimp/internal/version.Version={{ .Version }}'
      - -X 'github.com/tphx37/utuimp/internal/auth.tokenURL={{ .Env.UTUIMP_TOKEN_URL }}'
      - -X 'github.com/tphx37/utuimp/internal/auth.clientKey={{ .Env.UTUIMP_CLIENT_KEY }}'
      - -X 'github.com/tphx37/utuimp/internal/lastfm.apiKey={{ .Env.LASTFM_API_KEY }}'
      - -X 'github.com/tphx37/utuimp/internal/lastfm.apiSecret={{ .Env.LASTFM_API_SECRET }}'
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
      - GOTOOLCHAIN=local
    goos:
      - windows
    goarch:
      - amd64

archives:
  - id: utuimp
    ids:
      - utuimp-linux
      - utuimp-darwin
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE*
      - NOTICE
      - README*
      - CHANGELOG*
      - flatpak/io.github.tphx37.utuimp.desktop
      - assets/logo.png

  - id: utuimp-windows
    ids:
      - utuimp-windows
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - LICENSE*
      - NOTICE
      - README*
      - CHANGELOG*

nfpms:
  - id: arch
    package_name: utuimp
    ids: [utuimp-linux]
    file_name_template: "utuimp_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/tphx37/utuimp
    description: Universal terminal user interface media player
    license: GPL-3.0-or-later AND MIT
    formats: [archlinux]
    dependencies:
      - glibc
      - gstreamer
      - gst-plugins-base
      - gst-plugins-good
      - gst-libav
      - fontconfig
    contents:
      - src: flatpak/io.github.tphx37.utuimp.desktop
        dst: /usr/share/applications/io.github.tphx37.utuimp.desktop
      - src: assets/logo.png
        dst: /usr/share/icons/hicolor/256x256/apps/io.github.tphx37.utuimp.png
      - src: LICENSE
        dst: /usr/share/licenses/utuimp/LICENSE
      - src: NOTICE
        dst: /usr/share/licenses/utuimp/NOTICE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Darwin archives are built on the macOS job and handed to this one as
  # ./dist-darwin, outside the dist/ that --clean wipes.
  extra_files:
    - glob: ./dist-darwin/*.tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: tphx37
    name: utuimp
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  extra_files:
    - glob: ./dist-darwin/*.tar.gz
